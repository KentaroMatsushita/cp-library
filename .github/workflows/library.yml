name: Verify and publish library
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile standalone headers and multiple translation units
        run: python3 tools/check_headers.py
      - name: Offline differential and regression tests with sanitizers
        run: python3 tools/test.py --sanitize
      - name: Build documentation
        run: python3 tools/build_docs.py
      - name: Validate links and publication allowlist
        run: python3 tools/check_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: .verify-results/latest.json
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_LIBRARY_PAGES == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v4
